repos:
  - repo: local
    hooks:
      - id: cops-issue-coverage
        name: COPS issue documentation & test coverage check
        entry: python3 scripts/agent/check_issue_coverage.py --staged
        language: system
        stages: [pre-push, pre-commit]
        pass_filenames: false
      - id: cops-repository-contract
        name: COPS repository check
        entry: python3 scripts/agent/check.py
        language: system
        stages: [pre-push]
        pass_filenames: false
