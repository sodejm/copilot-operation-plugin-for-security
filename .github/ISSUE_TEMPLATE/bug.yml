name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including safe and sanitized evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps, environment, and relevant version or commit.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Impact and scope
      description: Who or what is affected? Remove secrets and personal data.
