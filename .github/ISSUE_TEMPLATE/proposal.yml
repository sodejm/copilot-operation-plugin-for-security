name: Change proposal
description: Propose a feature, policy, or architectural change
title: "[Proposal]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or maintainer problem without prescribing a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and tradeoffs
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, compatibility, and migration risks
