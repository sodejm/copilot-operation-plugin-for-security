name: COPS repository checks

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-service-laboratory:
    name: Isolated service laboratory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up runtime build tooling
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Obtain the pinned runtime prerequisites
        run: |
          python -m pip install cryptography==50.0.2 jsonschema==4.26.0
          mkdir -p "$RUNNER_TEMP/cops-runtime/wheels"
          cp laboratories/service-runtime/Dockerfile laboratories/service-runtime/requirements.txt laboratories/service-runtime/pin_runtime.py "$RUNNER_TEMP/cops-runtime/"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-filesize 65536 --output "$RUNNER_TEMP/cops-runtime/hexdump-3.3.zip" https://files.pythonhosted.org/packages/55/b3/279b1d57fa3681725d0db8820405cdcb4e62a9239c205e4ceac4391c78e4/hexdump-3.3.zip
          python laboratories/service-runtime/build_hexdump_wheel.py "$RUNNER_TEMP/cops-runtime/hexdump-3.3.zip" "$RUNNER_TEMP/cops-runtime/wheels"
          python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --find-links "$RUNNER_TEMP/cops-runtime/wheels" --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 --python-version 314 --implementation cp --abi cp314 --dest "$RUNNER_TEMP/cops-runtime/wheels" -r laboratories/service-runtime/requirements.txt
          docker pull python:3.14.6@sha256:51570a50616289f78f340811c34ca4384985f9e891819cbe7620f738d6ca8525
          docker image inspect python:3.14.6@sha256:51570a50616289f78f340811c34ca4384985f9e891819cbe7620f738d6ca8525 --format '{{.Id}}' > "$RUNNER_TEMP/cops-runtime/base.id"
          docker pull rancher/k3s@sha256:b032bfb68a10fee30ab60c160d32a6b3af7ea33620e9f7a29d59890e42ceefed
          docker pull rancher/mirrored-pause@sha256:412c4a7219cb8a299a37337f3d87810c5340095322e15594a1637785adad0f17
          docker pull python:3.14.6-slim@sha256:b921fe7e7522f828d45197a47656ec465a9b15689b27fa8e1fba2864fca5b967
      - name: Build without network access and run the strict gate
        run: |
          docker build --tag cops-service-runtime:acceptance --network none --pull=false --build-arg "BASE_IMAGE=$(cat "$RUNNER_TEMP/cops-runtime/base.id")" --iidfile "$RUNNER_TEMP/cops-runtime/image.id" "$RUNNER_TEMP/cops-runtime"
          cat "$RUNNER_TEMP/cops-runtime/base.id" "$RUNNER_TEMP/cops-runtime/image.id"
          make check-laboratory PYTHON=python LABORATORY_ARGS="--runtime docker --image $(cat "$RUNNER_TEMP/cops-runtime/image.id")"

  linux-bubblewrap-isolation:
    name: Linux bubblewrap isolation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bubblewrap, its AppArmor profile, and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap util-linux
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          python -m pip install -r requirements.txt
      - name: Verify required Linux isolation boundaries
        run: python -m pytest -m linux_bubblewrap tests/integration/test_linux_bubblewrap_sandbox.py -q

  portability-smoke:
    name: Operator smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check the operator entry point
        run: python -m cops doctor
      - name: Check the catalog and generated indexes
        run: |
          python -m cops list
          python -m cops validate
          python -m cops generate --check
      - name: Install reachability acceptance test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify test prerequisites
        run: python scripts/agent/check_prerequisites.py
      - name: Exercise local agent and MCP laboratory acceptance
        run: python -m pytest plugins/offensive-security/foundry-agent-harness/tests/test_laboratory.py tests/step_defs/test_agent_mcp_laboratories.py -q
      - name: Exercise reachability report acceptance
        run: python -m pytest tests/step_defs/test_cve_reachability.py -q
      - name: Exercise native Windows host assessment bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "plugins/offensive-security/host-assessment-workbench/scripts/exercise-windows-bridge.ps1"
          $runRoot = Join-Path $env:RUNNER_TEMP "cops-host-assessment-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $script -RunRoot $runRoot
      - name: Exercise Windows host assessment contract regressions
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_host_windows_assessment.py tests/step_defs/test_host_windows_privilege_boundaries_steps.py -q
      - name: Exercise bounded repository scanning
        run: python -m pytest tests/test_repository_context_reader.py tests/step_defs/test_repository_scanning.py -q
      - name: Exercise every offline demo
        run: |
          python -m cops demo security-logging-advisor
          python -m cops demo soc-investigation-workbench
          python -m cops demo sentinel-hunt-workbench
          python -m cops demo attack-path-workbench

  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux isolation runtime, AppArmor profile, and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap util-linux
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          python3 -m pip install -r requirements.txt
      - name: Validate repository and plugin
        run: make check PYTHON=python3

  soc-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify test prerequisites
        run: python scripts/agent/check_prerequisites.py
      - name: Test SOC investigation and dependency boundaries
        run: python -m pytest tests/step_defs/test_soc_investigation.py -q
      - name: Validate SOC development package
        run: python plugins/detection-hunting/soc-investigation-workbench/scripts/validate-package.py --allow-pending-vendor
