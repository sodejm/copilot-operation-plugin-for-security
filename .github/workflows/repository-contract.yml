name: COPS repository checks

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability-smoke:
    name: Operator smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check the operator entry point
        run: python -m cops doctor
      - name: Check the catalog and generated indexes
        run: |
          python -m cops list
          python -m cops validate
          python -m cops generate --check
      - name: Exercise every offline demo
        run: |
          python -m cops demo security-logging-advisor
          python -m cops demo soc-investigation-workbench
          python -m cops demo sentinel-hunt-workbench

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Validate repository and plugin
        run: make check

  soc-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test SOC investigation and dependency boundaries
        run: python -m pytest tests/step_defs/test_soc_investigation.py -q
      - name: Validate SOC development package
        run: python plugins/detection-hunting/soc-investigation-workbench/scripts/validate-package.py --allow-pending-vendor
