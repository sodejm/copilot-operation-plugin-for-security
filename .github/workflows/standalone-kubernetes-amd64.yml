name: Standalone Kubernetes containment (amd64)

on:
  push:
    branches: [codex/kubernetes-standalone-amd64-721842f9]

permissions:
  contents: read

jobs:
  kubernetes-containment:
    name: Isolated Kubernetes containment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify runner and source
        env:
          SOURCE_COMMIT: 721842f9410fb1cf6114871d2b384aea89804bb7
          COPS_TREE: d18fe9023f0c5f949b6f32824bf3375f5b071e9f
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD:cops)" = "$COPS_TREE"
          echo "Source commit $SOURCE_COMMIT (cops tree $COPS_TREE)" | tee -a "$GITHUB_STEP_SUMMARY"
          uname -srmo
          docker version --format '{{.Server.Version}}'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install containment dependencies
        run: python -m pip install cryptography==50.0.2 jsonschema==4.26.0
      - name: Provision pinned Kubernetes fixture images
        run: |
          python - <<'PY'
          import subprocess

          from cops.laboratory.kubernetes_lab import IMAGE_PINS

          for image in IMAGE_PINS["amd64"]:
              subprocess.run(["docker", "pull", image], check=True)
          PY
      - name: Verify containment and cleanup
        run: |
          set -o pipefail
          python -m cops.laboratory.kubernetes_lab | tee -a "$GITHUB_STEP_SUMMARY"
